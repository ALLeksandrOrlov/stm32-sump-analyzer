name: Firmware CI/CD

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-and-test:
    name: Docker / native / QEMU / firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the CI environment with patched QEMU
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ci
          load: true
          tags: sump-analyzer-ci:run
          cache-from: type=gha,scope=firmware-ci
          cache-to: type=gha,mode=max,scope=firmware-ci
      - name: Run all checks and package verified firmware
        env:
          SOURCE_REVISION: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          docker run --rm --network=none --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/project" \
            -e SOURCE_REVISION -e SOURCE_REF -e SOURCE_DIRTY=false \
            sump-analyzer-ci:run
      - name: Add stage results to the job summary
        if: always()
        run: |
          if test -f out/ci/reports/summary.md; then
            cat out/ci/reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save logs and JUnit report, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports-${{ github.sha }}
          path: out/ci/reports/
          if-no-files-found: warn
          retention-days: 30
      - name: Save verified release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-${{ github.sha }}
          path: out/ci/dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged firmware
    needs: build-and-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firmware-${{ github.sha }}
          path: release
      - name: Verify files and publish GitHub Release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import json, os
          info = json.load(open('build-info.json'))
          assert info['source_revision'] == os.environ['SOURCE_REVISION']
          assert info['source_dirty'] == 'false'
          assert info['tests'] == 'passed'
          PY
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            --title "$RELEASE_TAG" "${options[@]}" \
            meas_complex.elf meas_complex.hex meas_complex.bin meas_complex.map \
            build-info.json SHA256SUMS
